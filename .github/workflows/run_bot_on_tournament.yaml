name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *" # every 20 min, offset off the hour. Make sure to skip already-forecasted questions!

# The run pushes its records to the bot-data branch.
permissions:
  contents: write

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      # The budget ledger lives in the Actions cache because every run starts on a fresh machine.
      - name: Restore budget ledger
        uses: actions/cache/restore@v4
        with:
          path: .budget
          key: budget-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: budget-ledger-
      - name: Run bot
        id: run_bot
        run: |
          uv run python main.py
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Budget guard settings (see budget.py). Set as repository variables to override the defaults.
          BUDGET_USD: ${{ vars.BUDGET_USD }}
          BUDGET_CYCLE_DAY: ${{ vars.BUDGET_CYCLE_DAY }}
          BUDGET_PER_RUN_USD: ${{ vars.BUDGET_PER_RUN_USD }}
          # Model and experiment settings (see bot_config.py). Empty means the default in the code.
          FORECASTER_MODEL: ${{ vars.FORECASTER_MODEL }}
          ECONOMY_MODEL: ${{ vars.ECONOMY_MODEL }}
          HELPER_MODEL: ${{ vars.HELPER_MODEL }}
          CHALLENGER_VARIANT: ${{ vars.CHALLENGER_VARIANT }}
          SHADOW_FORECASTS: ${{ vars.SHADOW_FORECASTS }}
          SHADOWS_UNTIL: ${{ vars.SHADOWS_UNTIL }}
      - name: Save budget ledger
        if: always() && steps.run_bot.outputs.ledger_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .budget
          key: budget-ledger-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Push run records to the bot-data branch
        if: always()
        run: scripts/push_bot_data.sh .bot_data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
